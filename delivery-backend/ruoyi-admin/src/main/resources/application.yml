cloud-config:
  api-key: ${PCC_API_KEY:}
# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 25MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: false
  # 平台 AI 功能共用 DashScope API Key 和生成参数，各功能可独立选择模型并使用不同提示词。
  ai:
    model:
      chat: dashscope
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          # Spring AI 客户端默认值跟随评分模型；每项业务调用时仍会显式选择自己的模型。
          model: ${shop.ai-score.model}
          temperature: 0.2
          enable-thinking: false
          response-format:
            type: json_object
    retry:
      # 业务任务层负责可审计重试，Spring AI 单次调用不做长时间内置重试。
      max-attempts: 1
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 登录令牌签名密钥，由本地环境变量或 Docker 容器环境变量注入。
  secret: ${TOKEN_SECRET}
  # 令牌有效期（默认30分钟）
  expireTime: 30

shop:
  # 甄客行首页轮播外链域名白名单（逗号分隔，仅允许 HTTPS）
  home-banner:
    external-hosts: ${SHOP_HOME_BANNER_EXTERNAL_HOSTS:}
  event-sso:
    # 赛事系统票据验证接口和共享密钥必须由服务器环境变量注入，禁止写入源码。
    exchange-url: ${EVENT_SSO_EXCHANGE_URL:}
    client-secret: ${EVENT_SSO_CLIENT_SECRET:}
  event-points:
    # 赛事系统积分余额查询/划拨地址与密钥由服务器环境变量注入，禁止写入源码。
    balance-url: ${EVENT_POINTS_BALANCE_URL:}
    transfer-url: ${EVENT_POINTS_TRANSFER_URL:}
    client-secret: ${EVENT_POINTS_CLIENT_SECRET:}
  ai-score:
    model: qwen3.7-max
  product-certification:
    model: qwen3.7-plus
    # 认证原始材料使用容器内私有目录
    storage-path: /private/product-certification

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 生产健康检查：仅公开总体状态，内部自动检查应用、数据库、Redis 与磁盘。
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 微信支付 APIv3 配置。公开标识和路径保留在此处，真实密钥由环境变量注入。
wechat-pay:
  enabled: true
  # 与微信支付商户号绑定的已认证服务号 AppID；用于微信内 JSAPI 支付和网页分享。
  app-id: wx445f3b9c251e7617
  # 用于微信内网页 snsapi_base 授权及 JS-SDK ticket 获取，不会返回给前端。
  app-secret: ${WECHAT_PAY_APP_SECRET}
  merchant-id: 1704306287
  # 商户 API 证书序列号，必须与下方私钥来自同一套证书。
  merchant-serial-number: 28431D1FB21B77B728A64D2EAB776DDAE77F5710
  # 部署时把与证书序列号匹配的 apiclient_key.pem 挂载到该容器路径。
  private-key-path: /app/certs/apiclient_key.pem
  # APIv3 密钥用于平台证书和支付/退款通知解密。
  api-v3-key: ${WECHAT_PAY_API_V3_KEY}
  # 当前使用自动下载平台证书模式，不需要配置微信支付公钥 ID 和公钥文件。
  credential-mode: AUTO_CERTIFICATE
  # 两个通知地址必须是公网 HTTPS、不能携带查询参数，并转发到当前后端。
  payment-notify-url: https://dzshop.vip/api/shop/payments/wechat/notify/payment
  refund-notify-url: https://dzshop.vip/api/shop/payments/wechat/notify/refund
  # 公众号网页授权后返回的前端页面，不要携带查询参数。
  frontend-return-url: https://dzshop.vip/
  # 用于签署公众号 OAuth state，至少 32 个字符且不要与登录 token 密钥复用。
  oauth-state-secret: ${WECHAT_PAY_OAUTH_STATE_SECRET}

# 阿里云 OpenAPI 公共 RAM 凭证：营业执照 OCR 与号码认证共用。
aliyun:
  access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
  access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}

# 阿里云市场物流查询配置（APPCODE 鉴权）。购买订单和线上试用共用本配置。
aliyun-logistics:
  enabled: true
  # 默认适配阿里云市场“全国快递物流查询”接口；请求时只发送 no=运单号，不发送 type 或手机号。
  endpoint: https://wuliu.market.alicloudapi.com/kdi
  # 阿里云物流 AppCode，由环境变量注入。
  app-code: ${ALIYUN_LOGISTICS_APP_CODE:}
  # 与阿里云建立连接的最长等待秒数。
  connect-timeout-seconds: 5
  # 单次物流查询的最长等待秒数。
  request-timeout-seconds: 8

# 阿里云 OCR 企业资质识别：商家入驻营业执照识别 + 核验。
aliyun-license:
  enabled: true
  # OCR 公共云 endpoint。
  endpoint: ocr-api.cn-hangzhou.aliyuncs.com
  # 与阿里云建立连接的最长等待秒数。
  connect-timeout-seconds: 5
  # 单次识别/核验请求的最长等待秒数。
  request-timeout-seconds: 8
  # 识别/核验结果在 Redis 中的保留小时数，超过后提交时需重新识别并核验。
  verify-cache-hours: 24
  # 单个营业执照文件在缓存周期内允许的核验次数，防刷阿里云额度。
  verify-max-per-file: 5

# 腾讯位置服务：入驻提交时把营业执照地址解析为腾讯坐标，微信预览失败时使用 URI API 地点页兜底。
tencent-map:
  enabled: true
  # 地址解析和腾讯地点页共用同一个 Key，只在后端使用。
  key: ${TENCENT_MAP_KEY:}
  # URI API 要求填写在腾讯位置服务控制台登记的应用名称，不是地图 Key。
  referer: ${TENCENT_MAP_REFERER:zhenkexing}
  connect-timeout-seconds: 5
  request-timeout-seconds: 8

# 阿里云号码认证服务。短信验证码与 H5 一键登录使用上方公共 RAM 凭证。
aliyun-phone-auth:
  enabled: true
  sms:
    # 普通短信服务的已审核自定义签名与验证码模板；模板变量必须为 ${code}。
    sign-name: ${ALIYUN_PHONE_AUTH_SMS_SIGN_NAME:}
    template-code: ${ALIYUN_PHONE_AUTH_SMS_TEMPLATE_CODE:}
  h5:
    # H5 一键认证仍使用号码认证服务，不受短信发送方式变更影响。
    scene-code: ${ALIYUN_PHONE_AUTH_H5_SCENE_CODE:}
    page-url: ${ALIYUN_PHONE_AUTH_H5_PAGE_URL:}
